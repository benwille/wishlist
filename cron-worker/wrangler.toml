name = "wishlist-cron"
account_id = "788c79908ddfc22504d941beb4405026"
main = "worker.js"
compatibility_date = "2026-04-06"
compatibility_flags = ["nodejs_compat"]

# Cron triggers (all times UTC)
# Monday 15:00 UTC = 9am Mountain Daylight — link checker
# Wednesday 15:00 UTC = 9am MDT — low list check
[triggers]
crons = [
  "0 15 * * 1",
  "0 15 * * 3",
]

[[d1_databases]]
binding = "DB"
database_name = "wishlist"
database_id = "f28013a8-dcc8-42cd-a370-3a2bc63aec8c"

[[services]]
binding = "PUSH_WORKER"
service = "wishlist-push"

[[routes]]
pattern = "cron.theholidaywishlist.com/*"
zone_name = "theholidaywishlist.com"
